<!DOCTYPE html>
<html>
<head>
  <title>Quests of the Roundtable</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300&display=swap" rel="stylesheet">

  <!-- Add jQuery from CDN first -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
  <!-- Then add the WebSocket libraries -->
  <script src="/webjars/sockjs-client/sockjs.min.js"></script>
  <script src="/webjars/stomp-websocket/stomp.min.js"></script>
  
  <!-- Add immediate debug script -->
  <script>
    console.log('Debug: Page starting to load');
    window.onerror = function(msg, url, line) {
      console.log('Error: ' + msg + '\nURL: ' + url + '\nLine: ' + line);
      return false;
    };
    
    // Check jQuery loading
    window.addEventListener('load', function() {
      console.log('Debug: Window loaded');
      if (window.jQuery) {
        console.log('Debug: jQuery is loaded');
      } else {
        console.log('Debug: jQuery is NOT loaded');
      }
    });
  </script>
  
  <!-- Load our game logic last -->
  <script src="/socket.js"></script>
</head>
<body>
<noscript><h2 style="color: #ff0000">Seems your browser doesn't support Javascript! Websocket relies on Javascript being
  enabled. Please enable
  Javascript and reload this page!</h2></noscript>


<br>
<h1>Your ID:</h1>
<p id="player_id">
</p>
<!--<h7>Your ID:</h7>-->
<!--<p id="player_id">Your ID:</p>-->
<div id="main-content" class="container">
  <div id="info">
    <div class="col-md-6">
      <div class="form-group">
        <input type="text" id="name" class="form-control" placeholder="What is your name..">
        <input type="text" id="num" class="form-control" placeholder="Number Of Players..">
        <button id="send" class="btn btn-default" type="button">Make New Game</button>
      </div>
    </div>

    <div class="col-md-6">
      <div class="form-group">
        <input type="text" id="joincode" class="form-control" placeholder="Game ID..">
        <button id="code" class="btn btn-default" type="button">Join Game</button>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-md-12">
      <table id="conversation" class="table table-striped">
        <thead id="gameID">
        <tr>
          <th>Current Game ID:</th>
        </tr>
        </thead>
        <tbody id="greetings">
        </tbody>
        <div id="gameIdDisplay" style="font-size: 24px; margin: 20px 0; padding: 10px; background-color: #f0f0f0; border-radius: 5px;"></div>

        <div id="adventure_cards">
          <thead>
          <tr>
            <th>Your Cards:</th>
          </tr>
          </thead>
          <tbody id="deck">
          </tbody>
        </div>

        <div id="players ranks">
          <thead>
          <tr>
            <th>Rank Cards:</th>
          </tr>
          </thead>
          <tbody id="ranks">
          </tbody>
        </div>

        <div id="discard_pile">
          <thead>
          <tr>
            <th>Discard Pile:</th>
          </tr>
          </thead>
          <tbody id="discardPile">
          </tbody>
        </div>


        <div class="col-md-6">
          <div class="form-group">
            <label for="discardCard">Discard/Select Card:</label>
            <input type="text" id="discardCard" class="form-control" placeholder="Index of card">
            <button id="discard" class="btn btn-default" type="button">discard card</button>
          </div>
        </div>

        <div>

          <button id="getAdventureCard" class="btn btn-default" type="submit" onclick="getAdventureCard()">get Adventure card</button>

        </div>

        <button id="selectAlly" class="btn btn-default" type="submit" onclick="selectAlly()">Select Ally/Amour</button>

        <div id="gameBoard">
          <h4>Messages</h4>
          <div id="Messages">
            <!--Messages are shown here-->
          </div>
          <button id="getStoryCard" class="btn btn-default" type="submit" onclick="getStoryCard()" style="display:none">Get Story Card</button>
          <h4>Story Card:</h4>
          <div id="storyCard">
            <!--running story cards will be shown in here-->
          </div>
          <div id="Questions">
            <!--Questions are asked here-->
          </div>

          <div id="test_bid" style="display:none">
            <input id="bidNo_input" type="text">
            <button id="Bid_button" class="btn btn-default" type="submit">Bid</button>
          </div>

          <div id="card-picker" style="display:none">
            <div id="picker-status"></div>
            <div id="picker-card-list"></div>
            <div class="picker-btn-row">
              <button id="picker-next-btn" class="btn" onclick="pickerNextStage()" style="display:none">Next Stage &rarr;</button>
              <button id="picker-confirm-btn" class="btn" onclick="pickerConfirm()">Confirm</button>
              <button id="picker-clear-btn" class="btn" onclick="pickerClear()">Clear</button>
            </div>
          </div>

        </div>

      </table>
    </div>


    </table>
  </div>
</div>
</div>
</body>
</html>
